services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - mongo
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  mongo:
    image: mongo:7.0
    restart: unless-stopped